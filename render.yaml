# Render Blueprint — deploys Habitly as a free Node web service.
# In Render: New → Blueprint → connect this repo. Render reads this file,
# auto-generates JWT_SECRET, and asks you for the two Supabase values.
services:
  - type: web
    name: habitly
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: SUPABASE_URL
        sync: false # Supabase → Project Settings → API → Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase → Project Settings → API → service_role secret
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio key (optional; enables AI tips & meal ideas)
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: VAPID_PUBLIC_KEY
        sync: false # from `node scripts/gen-vapid.mjs` (same pair as private)
      - key: VAPID_PRIVATE_KEY
        sync: false # from `node scripts/gen-vapid.mjs`
      - key: VAPID_SUBJECT
        sync: false # e.g. mailto:you@example.com
      - key: CRON_SECRET
        generateValue: true # guards /api/push/run; copy into your cron job
      - key: NODE_VERSION
        value: "20"
