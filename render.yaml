# Render Blueprint — deploys Habitly as a free Node web service.
# In Render: New → Blueprint → connect this repo. Render reads this file,
# auto-generates JWT_SECRET, and only asks you for MONGODB_URI.
services:
  - type: web
    name: habitly
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: MONGODB_URI
        sync: false # you paste your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_VERSION
        value: "20"
