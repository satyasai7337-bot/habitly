# Render Blueprint — deploys Habitly as a free Node web service.
# In Render: New → Blueprint → connect this repo. Render reads this file,
# auto-generates JWT_SECRET, and asks you for the two Supabase values.
services:
  - type: web
    name: habitly
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: SUPABASE_URL
        sync: false # Supabase → Project Settings → API → Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase → Project Settings → API → service_role secret
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_VERSION
        value: "20"
